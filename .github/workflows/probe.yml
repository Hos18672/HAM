name: Probe live map (temporary)
on:
  push:
    branches: ['claude/haus-aller-menschen-build-8h94uf']
    paths: ['.github/probe/**', '.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: cd .github/probe && npm init -y >/dev/null && npm i playwright@1.56.1 && npx --no-install playwright install --with-deps chromium
      - run: node .github/probe/shot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: .github/probe/*.png
