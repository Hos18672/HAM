name: Probe live loader (temporary)
on:
  push:
    branches: ['claude/haus-aller-menschen-build-8h94uf']
    paths: ['.github/probe/**', '.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd .github/probe && npm init -y >/dev/null && npm i playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: curl -sS https://ansar-ham.netlify.app/de | head -c 6000 | sed 's/></>\n</g' | grep -i "script" | head -40
      - run: cd .github/probe && node probe.mjs
      - if: false
        uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots, path: .github/probe/shot-*.png }
