name: Contact map

# Renders the contact page's static map from OpenStreetMap's tiles and commits
# it, when the script that draws it changes. Some fifty tiles, once — not a
# service the site leans on at runtime.

on:
  push:
    branches: ['claude/haus-aller-menschen-build-8h94uf']
    paths: ['scripts/contact-map.mjs', '.github/workflows/contact-map.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — see the note in ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/contact-map.mjs

      - name: Commit the map if it changed
        run: |
          git add public/map-contact@1x.webp public/map-contact@2x.webp
          if git diff --cached --quiet; then
            echo "The map is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Contact map: render from OpenStreetMap"
          git push
