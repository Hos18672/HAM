name: Contact map

# Looks the house up from its address (Nominatim), then renders the contact
# page's static map from OpenStreetMap's tiles around it, and commits both,
# when either script changes. Three lookups and some fifty tiles, once — not a
# service the site leans on at runtime.

on:
  push:
    branches: ['claude/haus-aller-menschen-build-8h94uf']
    paths:
      - 'scripts/contact-map.mjs'
      - 'scripts/geocode-house.mjs'
      - '.github/workflows/contact-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # No `version:` here on purpose — see the note in ci.yml.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/geocode-house.mjs

      - run: node scripts/contact-map.mjs

      - name: Commit the map if it changed
        run: |
          git add lib/house-location.json public/map-contact@1x.webp public/map-contact@2x.webp
          if git diff --cached --quiet; then
            echo "The map is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "House location and contact map: from the address, via OpenStreetMap"
          git push
