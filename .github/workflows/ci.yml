name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A throwaway database for the run; nothing here is a real credential.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ham
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ham
  AUTH_SECRET: ci-secret-not-used-anywhere-else-0000
  AUTH_URL: http://127.0.0.1:3100
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
  ADMIN_EMAIL: redaktion@haus-aller-menschen.at
  ADMIN_PASSWORD: entwicklung-nur-lokal
  SUPABASE_STORAGE_BUCKET: media

jobs:
  check:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ham
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prepare the database
        run: |
          pnpm db:push --force
          pnpm db:seed

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the e2e and axe suites
        run: pnpm test:e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
