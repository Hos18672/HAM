services:
  db:
    image: postgres:16-alpine
    container_name: ham-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ham
    ports:
      - '5432:5432'
    volumes:
      - ham-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ham']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: node:22-alpine
    container_name: ham-app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ham
      DIRECT_URL: postgresql://postgres:postgres@db:5432/ham
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    env_file:
      - path: .env
        required: false
    ports:
      - '3000:3000'
    volumes:
      - .:/app
    command: sh -c "corepack enable && pnpm install && pnpm db:push && pnpm db:seed && pnpm dev"

volumes:
  ham-pgdata:
