plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// The site, without a trailing slash: https://example.org or https://host/sub.
def siteUrl = (findProperty('siteUrl') ?: 'https://hos18672.github.io/HAM').toString().replaceAll('/+$', '')
def siteUri = new URI(siteUrl)
def sitePath = siteUri.path ?: ''

android {
    namespace 'at.hausallermenschen.app'
    compileSdk 36

    defaultConfig {
        applicationId 'at.hausallermenschen.app'
        minSdk 26
        targetSdk 36
        versionCode((findProperty('versionCode') ?: '1').toString().toInteger())
        versionName((findProperty('versionName') ?: '2.0').toString())

        buildConfigField 'String', 'SITE_URL', "\"${siteUrl}\""
        manifestPlaceholders = [
            siteHost: siteUri.host,
            sitePath: sitePath.isEmpty() ? '/' : sitePath,
        ]
    }

    signingConfigs {
        release {
            // Supplied by CI from repository secrets; absent locally, where
            // only the debug build is signed.
            def store = System.getenv('ANDROID_KEYSTORE_FILE')
            if (store) {
                storeFile file(store)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        generateLocaleConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.06.00')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
